openapi: 3.0.0
info:
  title: Stats Tracker API
  version: 1.0.0
  description: API pre správu hráčov, zápasov a generovanie vyrovnaných tímov.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []

paths:
  /players/me:
    get:
      summary: Získanie detailu prihláseného hráča
      operationId: getMyPlayer
      tags:
        - Player
      responses:
        "200":
          description: Detail hráča prepojeného s prihlásením
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerMeDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Žiadny hráč nie je prepojený s týmto účtom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /players/{id}/link-user:
    patch:
      summary: Prepojenie hráča s Keycloak účtom (len ADMIN)
      operationId: linkPlayerToUser
      tags:
        - Player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkUserRequest"
      responses:
        "200":
          description: Prepojenie úspešné
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden – vyžaduje sa rola ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Hráč neexistuje
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Keycloak účet je už prepojený s iným hráčom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Zrušenie prepojenia hráča s Keycloak účtom (len ADMIN)
      operationId: unlinkPlayerFromUser
      tags:
        - Player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Prepojenie zrušené
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden – vyžaduje sa rola ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Hráč neexistuje
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /players:
    get:
      summary: Získanie zoznamu všetkých hráčov
      operationId: listPlayers
      tags:
        - Player
      responses:
        "200":
          description: Zoznam hráčov
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Pridanie nového hráča (UC1)
      operationId: createPlayer
      tags:
        - Player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerRequest"
      responses:
        "201":
          description: Hráč úspešne vytvorený
        "400":
          description: Bad Request – chýbajúce alebo neplatné pole
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict – prezývka je už obsadená
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /players/{id}:
    get:
      summary: Získanie detailu hráča
      operationId: getPlayer
      tags:
        - Player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Detail hráča
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Zmazanie hráča (len ADMIN)
      operationId: deletePlayer
      tags:
        - Player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Hráč zmazaný
        "401":
          description: Unauthorized
        "403":
          description: Forbidden – vyžaduje sa rola ADMIN
        "404":
          description: Hráč neexistuje

  /players/{id}/matches:
    get:
      summary: Získanie histórie zápasov hráča (stránkované)
      operationId: getPlayerMatches
      tags:
        - Player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Stránka histórie zápasov hráča
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerMatchHistoryEntry"
        "401":
          description: Unauthorized
        "404":
          description: Not Found

  /matches:
    get:
      summary: Získanie zoznamu všetkých zápasov
      operationId: listMatches
      tags:
        - Match
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Zoznam zápasov
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Vytvorenie nového zápasu
      operationId: createMatch
      tags:
        - Match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatchRequest"
      responses:
        "201":
          description: Zápas úspešne vytvorený
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /matches/{id}:
    get:
      summary: Získanie detailu zápasu
      operationId: getMatch
      tags:
        - Match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Detail zápasu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Zmazanie zápasu (len ADMIN)
      operationId: deleteMatch
      tags:
        - Match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Zápas zmazaný
        "401":
          description: Unauthorized
        "403":
          description: Forbidden – vyžaduje sa rola ADMIN
        "404":
          description: Zápas neexistuje

  /users:
    get:
      summary: Zoznam Keycloak používateľov (len ADMIN)
      operationId: listUsers
      tags:
        - User
      responses:
        "200":
          description: Zoznam používateľov
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeycloakUserDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden – vyžaduje sa rola ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Vytvorenie nového používateľa (len ADMIN)
      operationId: createUser
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: Používateľ úspešne vytvorený
        "400":
          description: Bad Request – neplatné pole
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden – vyžaduje sa rola ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict – e-mail je už zaregistrovaný
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    delete:
      summary: Zmazanie Keycloak používateľa (len ADMIN)
      operationId: deleteUser
      tags:
        - User
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Používateľ zmazaný
        "401":
          description: Unauthorized
        "403":
          description: Forbidden – vyžaduje sa rola ADMIN
        "404":
          description: Používateľ neexistuje

  /team-suggestions:
    post:
      summary: Generovanie návrhov vyrovnaných tímov (UC4)
      operationId: generateTeamSuggestions
      tags:
        - TeamSuggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamSuggestionRequest"
      responses:
        "200":
          description: Návrhy tímov úspešne vygenerované
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSuggestionResponse"
        "400":
          description: Bad Request – počet hráčov nie je presne 10, alebo sú duplikáty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found – hráč s daným ID neexistuje
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string

    # ── Player ────────────────────────────────────────────────────────────────
    PlayerSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        nickname:
          type: string
        matchesPlayed:
          type: integer
        avgKills:
          type: number
          format: double
        avgDeaths:
          type: number
          format: double
        avgAdr:
          type: number
          format: double
        avgKdRatio:
          type: number
          format: double
        winRate:
          type: number
          format: double
        avgKillsPerRound:
          type: number
          format: double
        keycloakId:
          type: string
          nullable: true
          description: Keycloak subject UUID linked to this player, null if not linked

    CreatePlayerRequest:
      type: object
      required:
        - name
        - nickname
      properties:
        name:
          type: string
          minLength: 1
        nickname:
          type: string
          minLength: 1

    # ── User ──────────────────────────────────────────────────────────────────
    UserCreateRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1

    # ── Team Suggestion ───────────────────────────────────────────────────────
    TeamSuggestionRequest:
      type: object
      required:
        - playerIds
      properties:
        playerIds:
          type: array
          items:
            type: integer
            format: int64
          minItems: 10
          maxItems: 10

    TeamSuggestionResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/TeamSuggestion"
        warnings:
          type: array
          description: Hráči bez histórie zápasov – použité neutrálne priemerné hodnoty
          items:
            type: string

    TeamSuggestion:
      type: object
      properties:
        teamA:
          $ref: "#/components/schemas/TeamDefinition"
        teamB:
          $ref: "#/components/schemas/TeamDefinition"
        adrDifference:
          type: number
          format: double
          description: Absolute ADR difference between teams (last 20 matches) – lower means more balanced
        teamAAdrAvg:
          type: number
          format: double
          description: Team A average ADR (last 20 matches per player)
        teamBAdrAvg:
          type: number
          format: double
          description: Team B average ADR (last 20 matches per player)

    TeamDefinition:
      type: object
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSummary"

    # ── Match ─────────────────────────────────────────────────────────────────
    MatchSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        map:
          type: string
        playedAt:
          type: string
          format: date
        team1Score:
          type: integer
        team2Score:
          type: integer

    PlayerStatsRequest:
      type: object
      required:
        - playerId
        - kills
        - deaths
        - damage
      properties:
        playerId:
          type: integer
          format: int64
        kills:
          type: integer
          minimum: 0
        deaths:
          type: integer
          minimum: 0
        damage:
          type: integer
          minimum: 0

    CreateMatchRequest:
      type: object
      required:
        - map
        - playedAt
        - team1Score
        - team2Score
        - team1Players
        - team2Players
      properties:
        map:
          type: string
          enum: [MIRAGE, INFERNO, DUST2, NUKE, ANUBIS, ANCIENT, OVERPASS]
        playedAt:
          type: string
          format: date
        team1Score:
          type: integer
          minimum: 0
        team2Score:
          type: integer
          minimum: 0
        team1Players:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/PlayerStatsRequest"
        team2Players:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/PlayerStatsRequest"

    # ── Match Detail ──────────────────────────────────────────────────────────
    MatchDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        map:
          type: string
        playedAt:
          type: string
          format: date
        team1Score:
          type: integer
        team2Score:
          type: integer
        team1Players:
          type: array
          items:
            $ref: "#/components/schemas/MatchPlayerStats"
        team2Players:
          type: array
          items:
            $ref: "#/components/schemas/MatchPlayerStats"

    MatchPlayerStats:
      type: object
      properties:
        playerId:
          type: integer
          format: int64
        playerNickname:
          type: string
        kills:
          type: integer
        deaths:
          type: integer
        damage:
          type: integer
        adr:
          type: number
          format: double

    # ── Player Detail ─────────────────────────────────────────────────────────
    PlayerDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nickname:
          type: string
        matchesPlayed:
          type: integer
        avgKills:
          type: number
          format: double
        avgDeaths:
          type: number
          format: double
        avgAdr:
          type: number
          format: double
        keycloakId:
          type: string
          nullable: true
          description: Keycloak subject UUID linked to this player, null if not linked
        recentMatches:
          type: array
          items:
            $ref: "#/components/schemas/PlayerMatchHistoryEntry"

    PlayerMatchHistoryEntry:
      type: object
      properties:
        matchId:
          type: integer
          format: int64
        map:
          type: string
        playedAt:
          type: string
          format: date
        team1Score:
          type: integer
        team2Score:
          type: integer
        playerTeam:
          type: string
        kills:
          type: integer
        deaths:
          type: integer
        damage:
          type: integer
        adr:
          type: number
          format: double

    # ── Player Me Detail ──────────────────────────────────────────────────────
    PlayerMeDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nickname:
          type: string
        matchesPlayed:
          type: integer
        avgKills:
          type: number
          format: double
        avgDeaths:
          type: number
          format: double
        avgAdr:
          type: number
          format: double
        rank:
          type: integer
          description: Poradie hráča podľa ADR medzi hráčmi s aspoň 1 zápasom
        recentMatches:
          type: array
          items:
            $ref: "#/components/schemas/PlayerMatchHistoryEntry"

    # ── Link User Request ─────────────────────────────────────────────────────
    LinkUserRequest:
      type: object
      required:
        - keycloakId
      properties:
        keycloakId:
          type: string

    # ── Keycloak User ─────────────────────────────────────────────────────────
    KeycloakUserDto:
      type: object
      properties:
        id:
          type: string
          description: Keycloak subject (UUID)
        username:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
